name: Run tests, build site

on:
  push:
    branches:
      - main

jobs:
  build_site:
    name: Run tests, build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - name: Run tests
        run: npx jest
      - name: Build site
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist
          single-commit: true
